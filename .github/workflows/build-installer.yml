name: Build Windows installer

# Builds the edit.ai desktop installer on a clean Windows VM (no local
# antivirus / privilege issues) and uploads the .exe as a downloadable
# artifact. Run it from the Actions tab (Run workflow) or on every push.
on:
  workflow_dispatch: {}
  push:
    branches: [main, claude/repo-code-review-7ogzxx]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build the installer
        # --publish never: just build the .exe, don't try to push it to a GitHub
        # release (which would need a token). We grab it as an artifact instead.
        run: npm run dist -- --publish never

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: edit-ai-windows-installer
          path: |
            dist/*.exe
          if-no-files-found: error
